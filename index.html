<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediStore MS · Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%92%8A%3C/text%3E%3C/svg%3E" />
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo"><i class="bi bi-prescription2"></i></div>
      <h1>Medical Store MS</h1>
      <p class="login-sub">Sign in to manage your pharmacy</p>

      <!-- Error / success message area -->
      <div id="loginAlert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label fw-600">Email or Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="loginEmail" placeholder="you@medstore.com" autocomplete="username" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-600">Password</label>
          <div class="password-wrap">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" autocomplete="current-password" required />
            </div>
            <button type="button" class="toggle-pw" id="togglePw" tabindex="-1"><i class="bi bi-eye"></i></button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked />
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="fs-sm" id="forgotPw">Forgot password?</a>
        </div>

        <label class="form-label fw-600">Sign in as (demo role)</label>
        <div class="login-role-grid mb-3" id="roleGrid">
          <div class="role-pill" data-role="Pharmacist"><i class="bi bi-capsule"></i>Pharmacist</div>
          <div class="role-pill" data-role="Store Manager"><i class="bi bi-clipboard-data"></i>Manager</div>
          <div class="role-pill" data-role="Admin"><i class="bi bi-shield-lock"></i>Admin</div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-600" id="loginBtn">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>

      <hr class="my-4" />
      <p class="text-center fs-sm text-muted-2 mb-0">
        Supabase authentication · live data<br />
        Demo password for every seeded account: <code>MediStore@123</code>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Supabase JS (UMD -> window.supabase) — must be a CLASSIC script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
  <!-- Project config + data adapter (window.SUPABASE_CONFIG / window.SB) -->
  <script type="module" src="js/supabase-config.js"></script>
  <script type="module" src="js/supabase-client.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
